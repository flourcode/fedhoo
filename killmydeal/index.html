<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kill My Deal — five questions before your manager asks them</title>
<meta name="description" content="Pressure-test a federal deal in five taps. Private by design. No customer names, no CRM, nothing leaves your phone.">
<meta property="og:title" content="Kill My Deal — five questions before your manager asks them">
<meta property="og:description" content="Pressure-test a federal deal in a minute. No login, no CRM, nothing saved.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FEF7FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
  :root {
    --primary:#6750A4; --on-primary:#FFF;
    --primary-container:#EADDFF; --on-primary-container:#21005D;
    --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
    --tertiary-container:#FFD8E4; --on-tertiary-container:#31111D;
    --error:#B3261E; --error-container:#F9DEDC; --on-error-container:#410E0B;
    --success:#146C2E; --success-container:#C4EED0; --on-success-container:#00210B;
    --warn:#7A5900; --warn-container:#FFDF9A; --on-warn-container:#261A00;
    --surface:#FEF7FF; --sc-low:#F7F2FA; --sc:#F3EDF7; --sc-high:#ECE6F0;
    --on-surface:#1D1B20; --on-surface-variant:#49454F;
    --outline:#79747E; --outline-variant:#CAC4D0;
    --elev1:0 1px 2px rgba(0,0,0,.28), 0 1px 3px 1px rgba(0,0,0,.12);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--surface); color:var(--on-surface);
    font-family:Roboto,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:'Roboto Mono',ui-monospace,monospace; }
  .wrap { max-width:520px; margin:0 auto; padding:14px 16px calc(28px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; height:52px; }
  .logo { font-size:17px; font-weight:500; }
  .home-link { font:inherit; font-size:14px; font-weight:500; color:var(--primary);
    background:none; border:0; cursor:pointer; padding:8px; }

  h1 { font-size:32px; font-weight:400; line-height:1.14; letter-spacing:-.5px; margin:20px 0 10px; }
  .dek { font-size:16px; line-height:1.5; color:var(--on-surface-variant); margin:0 0 26px; }
  .big { width:100%; background:var(--primary); color:var(--on-primary); border:0; border-radius:100px;
    font:inherit; font-size:17px; font-weight:500; padding:19px; cursor:pointer; box-shadow:var(--elev1);
    margin-bottom:12px; }
  .big.alt { background:var(--secondary-container); color:var(--on-secondary-container); box-shadow:none; }
  .ghost { width:100%; background:none; color:var(--primary); border:1px solid var(--outline);
    border-radius:100px; font:inherit; font-size:15px; font-weight:500; padding:15px; cursor:pointer; }
  .private { font-size:13px; color:var(--on-surface-variant); text-align:center; margin-top:18px; }
  .fine { font-size:12.5px; color:var(--on-surface-variant); line-height:1.5; }

  input { width:100%; background:var(--sc-high); color:var(--on-surface); border:0;
    border-bottom:1px solid var(--outline); border-radius:6px 6px 0 0; font:inherit; font-size:17px;
    padding:16px; outline:none; }
  input:focus { border-bottom:2px solid var(--primary); padding-bottom:15px; }
  label.fld { display:block; font-size:12.5px; letter-spacing:.3px; color:var(--on-surface-variant); margin:0 0 8px; }

  .dots { display:flex; gap:6px; margin:6px 0 26px; }
  .dot { flex:1; height:4px; border-radius:2px; background:var(--sc-high); }
  .dot.done { background:var(--primary); }
  .qnum { font-size:11.5px; letter-spacing:.7px; color:var(--on-surface-variant); text-transform:uppercase; }
  .qt { font-size:28px; font-weight:400; line-height:1.18; letter-spacing:-.3px; margin:8px 0 28px; }
  .ans { display:block; width:100%; font:inherit; font-size:19px; font-weight:500; letter-spacing:.3px;
    border:0; border-radius:20px; padding:22px; margin-bottom:12px; cursor:pointer; }
  .a-yes { background:var(--success-container); color:var(--on-success-container); }
  .a-sort { background:var(--warn-container); color:var(--on-warn-container); }
  .a-no { background:var(--error-container); color:var(--on-error-container); }
  .ans { display:flex; align-items:center; gap:12px; }
  .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .back { font:inherit; font-size:14px; font-weight:500; color:var(--on-surface-variant);
    background:none; border:0; padding:14px 4px; cursor:pointer; }

  /* result: one screen */
  .headline-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .score { font-size:76px; font-weight:900; line-height:1; letter-spacing:-3px; color:var(--primary); }
  .verdict { font-size:15px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    border-radius:100px; padding:7px 16px; }
  .v-ready{background:var(--success-container);color:var(--on-success-container);}
  .v-proof{background:var(--warn-container);color:var(--on-warn-container);}
  .v-prove{background:var(--tertiary-container);color:var(--on-tertiary-container);}
  .v-dont{background:var(--error-container);color:var(--on-error-container);}
  .attack { font-size:22px; font-weight:500; line-height:1.3; margin:18px 0 20px; }
  .pillars { display:flex; flex-direction:column; gap:2px; margin-bottom:22px; }
  .pill-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--outline-variant); }
  .pill-n { flex:1; font-size:16px; font-weight:500; letter-spacing:.4px; }
  .pill-q { font-size:13px; color:var(--on-surface-variant); }
  .mark { font-size:20px; font-weight:700; width:28px; text-align:center; }
  .m-yes { color:var(--success); } .m-sort { color:var(--warn); } .m-no { color:var(--error); }
  .ready-for { background:var(--primary-container); color:var(--on-primary-container);
    border-radius:16px; padding:18px; margin-bottom:18px; }
  .ready-k { font-size:11px; letter-spacing:.7px; text-transform:uppercase; opacity:.8; }
  .ready-q { font-size:18px; font-weight:500; line-height:1.4; margin-top:8px; }
  .acts { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .act { flex:1 1 140px; font:inherit; font-size:15px; font-weight:500; color:var(--primary);
    background:none; border:1px solid var(--outline); border-radius:100px; padding:15px; cursor:pointer; }
  .act-p { background:var(--primary); color:var(--on-primary); border-color:transparent; }
  details.why { margin-top:18px; }
  details.why summary { font-size:14px; font-weight:500; color:var(--primary); cursor:pointer; padding:10px 0; }
  details.why .body { font-size:14px; line-height:1.6; color:var(--on-surface-variant); }

  /* grill */
  .grill-q { font-size:26px; font-weight:400; line-height:1.25; margin:24px 0 32px; }
  .grill-sub { font-size:13px; letter-spacing:.6px; text-transform:uppercase; color:var(--on-surface-variant); }
  .verdict-big { font-size:30px; font-weight:500; line-height:1.25; margin:20px 0 10px; }

  /* manager */
  .askbox { background:var(--sc-low); border-radius:16px; padding:18px; margin-bottom:18px; }
  .askrow { font-size:16px; line-height:1.45; padding:10px 0; border-top:1px solid var(--outline-variant); }
  .askrow:first-of-type { border-top:0; padding-top:0; }
  .askrow b { font-weight:500; letter-spacing:.4px; }
  .diag { background:var(--error-container); color:var(--on-error-container);
    border-radius:16px; padding:20px; margin-bottom:16px; }
  .diag.ok { background:var(--success-container); color:var(--on-success-container); }
  .diag-t { font-size:22px; font-weight:500; line-height:1.25; }
  .diag-b { font-size:15px; line-height:1.5; margin-top:8px; }
  .counts { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .cnt { background:var(--sc-low); border-radius:14px; padding:14px 10px; text-align:center; }
  .cnt-v { font-size:26px; font-weight:500; color:var(--primary); }
  .cnt-k { font-size:11px; letter-spacing:.3px; text-transform:uppercase; color:var(--on-surface-variant); margin-top:2px; }
  .drow { display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--outline-variant); }
  .drow:first-of-type { border-top:0; }
  .dname { flex:1; font-size:15.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dhole { font-size:12.5px; color:var(--on-surface-variant); }
  .dscore { font-size:15px; font-weight:500; white-space:nowrap; }
  .empty { font-size:15px; color:var(--on-surface-variant); line-height:1.55; padding:14px 0; }
  footer { margin-top:44px; border-top:1px solid var(--outline-variant); padding-top:16px;
    font-size:12px; line-height:1.6; color:var(--on-surface-variant); }
  footer a { color:var(--primary); }

  /* the five questions, previewed on the home screen */
  .peek { background:var(--sc-low); border-radius:16px; padding:16px 18px; margin:22px 0 4px; }
  .peek-k { font-size:11px; letter-spacing:.7px; text-transform:uppercase; color:var(--on-surface-variant); margin-bottom:10px; }
  .peek-row { font-size:14.5px; line-height:1.5; padding:5px 0; color:var(--on-surface-variant); }
  .peek-row b { color:var(--on-surface); font-weight:500; letter-spacing:.4px; margin-right:6px; }

  /* Mark */
  .markblk { display:grid; grid-template-columns:64px 1fr; gap:16px; align-items:start;
    background:var(--sc-low); border-radius:20px; padding:20px; margin-top:28px; }
  .markblk.nophoto { grid-template-columns:1fr; }
  .mark-photo { width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .mark-body { min-width:0; }
  .mark-name { font-size:17px; font-weight:500; margin-bottom:6px; }
  .mark-p { font-size:14px; line-height:1.55; color:var(--on-surface-variant); margin:0 0 10px; }
  .mark-cta { display:inline-block; background:var(--primary); color:var(--on-primary);
    text-decoration:none; font-size:14.5px; font-weight:500; border-radius:100px; padding:12px 20px; }
  .mark-fine { font-size:12px; line-height:1.5; color:var(--on-surface-variant); margin-top:10px; }
  @media (max-width:420px) { .markblk { grid-template-columns:1fr; } }

  /* ── M3: motion tokens (emphasized easing, standard durations) ── */
  :root {
    --ease-emph: cubic-bezier(.2, 0, 0, 1);
    --ease-emph-dec: cubic-bezier(.05, .7, .1, 1);
    --dur-short: 200ms; --dur-medium: 350ms;
    --state-hover: .08; --state-focus: .10; --state-press: .10;
  }
  /* ── M3: icons ── */
  .msym { font-family:'Material Symbols Rounded'; font-weight:400; font-style:normal;
    font-size:20px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block;
    white-space:nowrap; direction:ltr; -webkit-font-feature-settings:'liga';
    -webkit-font-smoothing:antialiased; vertical-align:-4px; }
  .msym-lg { font-size:24px; vertical-align:-6px; }

  /* ── M3: state layers. Every interactive surface gets hover/focus/press
     overlays at the specified opacities, rather than ad-hoc filter tricks. ── */
  .big, .ghost, .act, .ans, .mark-cta, .home-link, .mode {
    position:relative; overflow:hidden; isolation:isolate;
    transition:box-shadow var(--dur-short) var(--ease-emph); }
  .big::after, .ghost::after, .act::after, .ans::after, .mark-cta::after,
  .home-link::after, .mode::after {
    content:''; position:absolute; inset:0; background:currentColor; opacity:0;
    transition:opacity var(--dur-short) var(--ease-emph); pointer-events:none; z-index:-1; }
  .big:hover::after, .ghost:hover::after, .act:hover::after, .ans:hover::after,
  .mark-cta:hover::after, .home-link:hover::after, .mode:hover::after { opacity:var(--state-hover); }
  .big:active::after, .ghost:active::after, .act:active::after, .ans:active::after,
  .mark-cta:active::after, .home-link:active::after, .mode:active::after { opacity:var(--state-press); }

  /* ── M3: visible focus indicator, 3px, 2px offset ── */
  :focus-visible { outline:3px solid var(--primary); outline-offset:2px; border-radius:8px; }
  .ans:focus-visible, .big:focus-visible, .act:focus-visible { outline-offset:3px; }

  /* ── M3: respect reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ── M3: dark colour scheme ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary:#D0BCFF; --on-primary:#381E72;
      --primary-container:#4F378B; --on-primary-container:#EADDFF;
      --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
      --tertiary-container:#633B48; --on-tertiary-container:#FFD8E4;
      --error:#F2B8B5; --error-container:#8C1D18; --on-error-container:#F9DEDC;
      --success:#7CD992; --success-container:#005321; --on-success-container:#C4EED0;
      --warn:#E8C468; --warn-container:#5C4200; --on-warn-container:#FFDF9A;
      --surface:#141218; --sc-low:#1D1B20; --sc:#211F26; --sc-high:#2B2930;
      --on-surface:#E6E0E9; --on-surface-variant:#CAC4D0;
      --outline:#938F99; --outline-variant:#49454F;
      --elev1:0 1px 3px rgba(0,0,0,.5);
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Kill My Deal</div>
    <button class="home-link" id="homeBtn" hidden>Start over</button>
  </header>
  <div id="screen" aria-live="polite"></div>
  <footer>
    Built by <a href="https://fedhoo.com" target="_blank" rel="noopener">fedhoo</a>.
    Everything runs on this device. Nothing is uploaded, no account, no customer names.
  </footer>
</div>

<script>
'use strict';
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const el = () => document.getElementById('screen');

/* ── Five things. Five words a manager can remember without opening this. ── */
const P = [
  { k:'customer', n:'CUSTOMER', short:'Do they actually want this?',
    q:'Has the customer actually said they want to solve this?', w:20 },
  { k:'money', n:'MONEY', short:'Is there actually funding?',
    q:'Do you know where the money comes from?', w:26 },
  { k:'power', n:'POWER', short:'Are you connected to someone who can make it happen?',
    q:'Are you talking to someone who can make this happen?', w:22 },
  { k:'path', n:'PATH', short:'Do you know how they buy?',
    q:'Do you know how they will buy it?', w:16 },
  { k:'now', n:'NOW', short:'Is something forcing action?',
    q:'Is there a real reason this happens now?', w:16 },
];
const VAL = { yes:92, sort:50, no:8 };
const MARK = { yes:'✓', sort:'?', no:'✗' };
const ICON = { yes:'check_circle', sort:'help', no:'cancel' };

/* the three questions a manager asks when a pillar is soft */
const GRILL = {
  customer: ['What has the customer actually done that proves they intend to buy?',
             'Who said they want this, and what exactly did they say?',
             'What happens to them if they do nothing?'],
  money: ['Who exactly has told you the money is available?',
          'What budget does it come out of?',
          'What happens to your date if the funding slips a quarter?'],
  power: ['Who have you met who can actually move this forward?',
          'Who signs, and have you ever been in a room with them?',
          'Who inside is telling you things you did not have to ask for?'],
  path: ['How would they award this, and through which contracting office?',
         'What vehicle would it go through, and are you on it?',
         'Who else can they buy this from more easily than you?'],
  now: ['What is forcing them to act this year instead of next?',
        'What is the next dated step in their process?',
        'Who owns that date on their side?'],
};
const FIX = {
  customer:'Get the customer to say the problem out loud, in their words.',
  money:'Get one person at the customer to name the funding line this week.',
  power:'Get one meeting above your current contact.',
  path:'Ask which contracting office and vehicle they would use.',
  now:'Find the deadline: expiring contract, end of life, mandate, or budget year.',
};

function score(a) {
  const v = (k) => VAL[a[k]];
  let total = Math.round(P.reduce((s,p) => s + v(p.k) * p.w, 0) / P.reduce((s,p) => s + p.w, 0));
  const caps = [];
  if (a.money === 'no') { caps.push('no funding evidence'); total = Math.min(total, 55); }
  if (a.power === 'no') { caps.push('no access to anyone who can act'); total = Math.min(total, 60); }
  if (a.customer === 'no') { caps.push('the customer has not said they want this'); total = Math.min(total, 45); }
  const label = total >= 75 ? ['READY TO DEFEND','ready'] :
                total >= 55 ? ['NEEDS PROOF','proof'] :
                total >= 35 ? ['PROVE IT FIRST','prove'] : ['DO NOT CARRY IT','dont'];
  // weakest pillar, money breaking ties because that is what gets attacked
  const ranked = [...P].map(p => ({ ...p, v:v(p.k) }))
    .sort((x,y) => x.v - y.v || (y.k === 'money') - (x.k === 'money'));
  const weak = ranked[0];
  const ATTACK = {
    customer:'Your boss will ask whether the customer actually wants this.',
    money:'Your boss is going to come after the money.',
    power:'Your boss will ask who you have actually met.',
    path:'Your boss will ask how this even gets bought.',
    now:'Your boss will ask why this happens now and not next year.',
  };
  const strongOnes = P.filter(p => a[p.k] === 'yes').map(p => p.n.toLowerCase());
  return { total, label:label[0], cls:label[1], weak, caps, ranked,
           attack: total >= 75 ? 'Nothing obvious to attack. Bring the proof anyway.' : ATTACK[weak.k],
           strongOnes };
}

/* ── state ── */
let mode = 'seller', nick = '', answers = {}, step = 0, grillStep = 0, grillOuch = 0, lastScore = null;
const setHome = (on) => { document.getElementById('homeBtn').hidden = !on; };

/* ── screens ── */
function home() {
  mode = 'seller'; answers = {}; step = 0; nick = '';
  setHome(false);
  el().innerHTML = `
    <h1>Don't get killed in pipeline review.</h1>
    <p class="dek">Five questions before your manager asks them. Takes a minute, works on your phone
      in the parking lot.</p>
    <button class="big" id="prep"><span class="msym" aria-hidden="true">bolt</span> PRESSURE-TEST MY DEAL</button>
    <div class="peek">
      <div class="peek-k mono">The five questions</div>
      ${P.map(p => `<div class="peek-row"><b>${p.n}</b> ${esc(p.short)}</div>`).join('')}
    </div>
    <div class="private"><span class="msym" aria-hidden="true">lock</span> Nothing is saved, sent, or stored. Close the tab and it's gone.</div>`;
  document.getElementById('prep').onclick = () => ask(0);
}

function nicknameUNUSED(which) {
  mode = which; setHome(true);
  el().innerHTML = `
    <h1>${which === 'seller' ? 'What are you carrying?' : 'Which deal are you inspecting?'}</h1>
    <p class="dek">Give it a nickname. Don't use the customer name.</p>
    <label class="fld" for="nick">Nickname</label>
    <input id="nick" placeholder="Big Q2 deal" autocomplete="off">
    <div style="height:20px"></div>
    <button class="big" id="go">START →</button>
    ${which === 'manager' ? `<div class="askbox" style="margin-top:22px;">
      <div class="qnum mono" style="margin-bottom:10px;">Ask the seller these five questions</div>
      ${P.map(p => `<div class="askrow"><b>${p.n}</b> — ${esc(p.q)}</div>`).join('')}
    </div>` : ''}`;
  const input = document.getElementById('nick');
  const start = () => { nick = input.value.trim() || (which === 'manager' ? 'Deal ' + (all().length + 1) : 'My deal'); ask(0); };
  document.getElementById('go').onclick = start;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
  input.focus();
}

function ask(i) {
  step = i; setHome(true);
  const p = P[i];
  el().innerHTML = `
    <div class="dots">${P.map((_, j) => `<span class="dot${j <= i ? ' done' : ''}"></span>`).join('')}</div>
    <div class="qnum mono">${p.n} · question ${i + 1} of ${P.length}</div>
    <div class="qt">${esc(mode === 'manager' ? p.q : p.q)}</div>
    <div role="radiogroup" aria-label="${esc(p.q)}">
      <button class="ans a-yes" data-v="yes" role="radio" aria-checked="false"><span class="msym msym-lg" aria-hidden="true">check_circle</span> YES</button>
      <button class="ans a-sort" data-v="sort" role="radio" aria-checked="false"><span class="msym msym-lg" aria-hidden="true">help</span> SORT OF</button>
      <button class="ans a-no" data-v="no" role="radio" aria-checked="false"><span class="msym msym-lg" aria-hidden="true">cancel</span> NO</button>
    </div>
    ${i > 0 ? '<button class="back" id="back">← Back</button>' : ''}`;
  el().querySelectorAll('.ans').forEach(b => b.onclick = () => {
    answers[p.k] = b.dataset.v;
    if (i < P.length - 1) setTimeout(() => ask(i + 1), 120);
    else setTimeout(result, 120);
  });
  const bk = document.getElementById('back');
  if (bk) bk.onclick = () => ask(i - 1);
  window.scrollTo({ top:0 });
}

function result() {
  const s = score(answers);
  lastScore = s;
  setHome(true);
  el().innerHTML = `
    <div class="headline-row"><span class="score">${s.total}</span>
      <span class="verdict v-${s.cls}">${s.label}</span></div>
    <div class="attack">${esc(s.attack)}</div>

    <div class="pillars">
      ${P.map(p => `<div class="pill-row">
        <span class="pill-n">${p.n}<div class="pill-q">${esc(p.short)}</div></span>
        <span class="mark m-${answers[p.k]}"><span class="msym msym-lg" aria-hidden="true">${ICON[answers[p.k]]}</span><span class="sr">${answers[p.k] === 'yes' ? 'yes' : answers[p.k] === 'sort' ? 'sort of' : 'no'}</span></span>
      </div>`).join('')}
    </div>

    ${s.total >= 75 ? '' : `<div class="ready-for">
      <div class="ready-k">Be ready for</div>
      <div class="ready-q">“${esc(GRILL[s.weak.k][0])}”</div>
    </div>`}

    <div class="acts">
      <button class="act act-p" id="grill"><span class="msym" aria-hidden="true">gavel</span> GRILL ME</button>
      <button class="act" id="copy"><span class="msym" aria-hidden="true">content_copy</span> Copy for the review</button>
      <button class="act" id="again"><span class="msym" aria-hidden="true">refresh</span> Another deal</button>
    </div>

    <details class="why"><summary>Why this score?</summary>
      <div class="body">
        Weights: money 26, power 22, customer 20, path 16, now 16. YES scores 92, SORT OF 50, NO 8.
        ${s.caps.length ? `Capped because of ${esc(s.caps.join(' and '))}.` : ''}
        ${s.strongOnes.length ? `You are solid on ${esc(s.strongOnes.join(', '))}.` : ''}
        <br><br><strong>Do this first:</strong> ${esc(FIX[s.weak.k])}
      </div>
    </details>`;
  document.getElementById('grill').onclick = () => { grillStep = 0; grillOuch = 0; grill(); };
  document.getElementById('again').onclick = () => { answers = {}; ask(0); };
  document.getElementById('copy').onclick = () => {
    const txt = `${s.total} — ${s.label}\n${s.attack}\n`
      + P.map(p => `${MARK[answers[p.k]]} ${p.n}`).join('  ')
      + `\nBe ready for: "${GRILL[s.weak.k][0]}"\nBefore the review: ${FIX[s.weak.k]}\n\nkillmydeal.com`;
    try { navigator.clipboard.writeText(txt); } catch {}
    document.getElementById('copy').textContent = 'Copied ✓';
  };
  mountMark();
  window.scrollTo({ top:0 });
}

/* ── boss mode ── */
function grill() {
  const qs = GRILL[lastScore.weak.k];
  if (grillStep >= 3) return grillDone();
  setHome(true);
  el().innerHTML = `
    <div class="grill-sub mono">Your manager · question ${grillStep + 1} of 3</div>
    <div class="grill-q">“${esc(qs[grillStep])}”</div>
    <div role="radiogroup" aria-label="Can you answer this?">
      <button class="ans a-yes" data-v="ok" role="radio" aria-checked="false"><span class="msym msym-lg" aria-hidden="true">thumb_up</span> I CAN ANSWER THAT</button>
      <button class="ans a-no" data-v="ouch" role="radio" aria-checked="false"><span class="msym msym-lg" aria-hidden="true">sentiment_dissatisfied</span> OUCH</button>
    </div>`;
  el().querySelectorAll('.ans').forEach(b => b.onclick = () => {
    if (b.dataset.v === 'ouch') grillOuch++;
    grillStep++;
    setTimeout(grill, 120);
  });
  window.scrollTo({ top:0 });
}
function grillDone() {
  const w = lastScore.weak;
  const verdict = grillOuch === 0 ? 'You are ready.'
    : grillOuch === 1 ? 'Close. One hole left.'
    : 'You are not ready for this conversation yet.';
  el().innerHTML = `
    <div class="grill-sub mono">Boss mode</div>
    <div class="verdict-big">${esc(verdict)}</div>
    <div class="dek">${grillOuch ? `You could not answer ${grillOuch} of 3.` : 'You answered all three.'}
      The thing you cannot bluff your way through is <strong>${w.n.toLowerCase()}</strong>.</div>
    <div class="ready-for"><div class="ready-k">Before the review</div>
      <div class="ready-q">${esc(FIX[w.k])}</div></div>
    <div class="acts">
      <button class="act act-p" id="back2">Back to the score</button>
      <button class="act" id="another">Score another deal</button>
    </div>`;
  document.getElementById('back2').onclick = result;
  document.getElementById('another').onclick = () => { answers = {}; ask(0); };
  mountMark();
  window.scrollTo({ top:0 });
}


/* ── Mark, after the work is done. One ask, no pitch. ── */
function mountMark() {
  if (document.getElementById('markBlock')) return;
  const w = document.createElement('div');
  w.id = 'markBlock';
  w.className = 'markblk';
  w.innerHTML = `
    <img class="mark-photo" src="https://fedhoo.com/images/mark.jpg" alt="Mark Flournoy"
         onerror="this.closest('.markblk').classList.add('nophoto'); this.remove();">
    <div class="mark-body">
      <div class="mark-name">I'm Mark.</div>
      <p class="mark-p">Six years leading Federal Partner Sales at AWS, before that F5 and Red Hat,
        and 20 years a Marine officer. I've been the seller, the manager, and the person explaining
        the forecast to somebody above me.</p>
      <p class="mark-p">If a deal on this list is worth more than an afternoon, it's worth an hour
        with someone who has already argued about it.</p>
      <a class="mark-cta" href="https://calendly.com/markflournoy/deepdive?utm_source=killmydeal&utm_medium=result&utm_content=after_score"
         target="_blank" rel="noopener"><span class="msym" aria-hidden="true">event</span> Work it through with Mark</a>
      <div class="mark-fine">One hour, $250. Bring the deal you just scored. Nothing you typed here
        goes with it — there was nothing to send.</div>
    </div>`;
  el().appendChild(w);
}

document.getElementById('homeBtn').onclick = home;
home();
</script>
</body>
</html>
